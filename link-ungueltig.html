<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link ungültig – LovePath by Maria</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --plum-900: #462D3C; --plum-950: #2A1B24; --cream-100: #EEE9E3; --cream-200: #E4DDD5;
      --terracotta-500: #B4735C;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--cream-200); color: var(--plum-900);
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    main { width: 100%; max-width: 560px; background: var(--cream-100); border-radius: 14px; padding: 40px 32px; }
    .logo { display: block; width: 240px; margin: 0 auto 32px; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--terracotta-500); }
    h1 { margin: 0 0 20px; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 32px; line-height: 1.15; }
    p { font-size: 16px; line-height: 1.65; margin: 0 0 16px; }
    a.btn { display: inline-block; margin-top: 12px; background: var(--plum-950); color: var(--cream-100); text-decoration: none; font-weight: 600;
      font-size: 15px; padding: 14px 26px; border-radius: 10px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.svg" alt="LovePath by Maria">
    <p class="eyebrow">Bestätigung</p>
    <h1>Dieser Link funktioniert leider nicht.</h1>
    <p>Vielleicht wurde er beim Kopieren abgeschnitten, oder er ist nicht mehr gültig.</p>
    <p>Am einfachsten: Mach den Beziehungs-Check noch einmal. Du bekommst dann sofort einen neuen Bestätigungslink.</p>
    <a class="btn" href="/">Zum Beziehungs-Check</a>
  </main>
</body>
</html>
