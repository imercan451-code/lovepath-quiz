<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beziehungs-Check · LovePath by Maria</title>
<meta name="description" content="Was steht zwischen euch? 4 kurze Fragen, 1 Minute – mit Auswertung und einem ersten Schritt für euch als Paar.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pflaume: #4A2C3D;
    --rose: #D8A7A0;
    --sand: #F3EBE3;
    --salbei: #8FA398;
    --anthrazit: #2E2A2B;
    --weiss: #FFFFFF;
    --head: 'Fraunces', Georgia, serif;
    --body: 'Karla', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #FBF7F3;
    color: var(--anthrazit);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  header { width: 100%; max-width: 640px; display: flex; justify-content: center; margin-bottom: 20px; }
  header img { width: 240px; max-width: 70%; height: auto; }
  main { width: 100%; max-width: 640px; }

  .quiz {
    background: var(--sand);
    padding: 40px 32px;
    border-radius: 20px;
  }
  @media (max-width: 480px) { .quiz { padding: 28px 20px; } }

  .eyebrow { margin: 0 0 10px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--salbei); font-weight: 700; }
  h2 { font-family: var(--head); font-size: 34px; line-height: 1.15; margin: 0 0 14px; color: var(--pflaume); font-weight: 600; }
  h3 { font-family: var(--head); font-size: 25px; line-height: 1.25; margin: 18px 0 20px; color: var(--pflaume); font-weight: 500; }
  @media (max-width: 480px) { h2 { font-size: 28px; } h3 { font-size: 22px; } }
  p { font-size: 17px; line-height: 1.55; margin: 0 0 22px; }
  .small { font-size: 14px; opacity: .7; }

  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bar { height: 6px; background: rgba(74,44,61,.12); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--rose); border-radius: 99px; transition: width .3s ease; }

  .answers { display: flex; flex-direction: column; gap: 12px; }
  .answer {
    text-align: left; font-family: var(--body); font-size: 16px; line-height: 1.4;
    padding: 16px 18px; border-radius: 12px;
    border: 1.5px solid rgba(74,44,61,.18); background: rgba(255,255,255,.6);
    color: var(--anthrazit); cursor: pointer; transition: all .15s ease;
  }
  .answer:hover, .answer.active { border-color: var(--pflaume); background: var(--weiss); }

  .btn {
    display: inline-block; font-family: var(--body); font-size: 16px; font-weight: 700;
    padding: 15px 26px; border-radius: 999px; border: none;
    background: var(--pflaume); color: var(--weiss); cursor: pointer; text-decoration: none;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .6; cursor: default; }
  .link {
    background: none; border: none; padding: 0; font-family: var(--body); font-size: 14px;
    color: var(--pflaume); cursor: pointer; text-decoration: underline;
  }

  label.field { display: block; font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  label.field input {
    display: block; width: 100%; margin-top: 6px; padding: 13px 14px; font-size: 16px;
    font-family: var(--body); border-radius: 10px; border: 1.5px solid rgba(74,44,61,.2);
    background: var(--weiss); color: var(--anthrazit); outline: none;
  }
  label.field input:focus { border-color: var(--pflaume); }
  label.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; margin: 6px 0 18px; }
  label.check input { margin-top: 3px; }
  .error { color: #A23B3B; font-size: 14px; margin: 0 0 14px; }
  .tip {
    background: var(--weiss); border-left: 4px solid var(--salbei);
    padding: 16px 18px; border-radius: 10px; font-size: 16px; line-height: 1.5; margin-bottom: 24px;
  }
  .demo { margin-top: 28px; font-size: 12px; opacity: .55; }

  footer { margin-top: 28px; font-size: 13px; opacity: .6; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <header>
    <img src="logo.svg" alt="LovePath by Maria">
  </header>

  <main>
    <div class="quiz" id="quiz" aria-live="polite"></div>
  </main>

  <footer>
    © LovePath by Maria
    <!-- Für eine echte Webseite in Deutschland: Links zu Impressum und Datenschutz hier ergänzen -->
  </footer>

<script>
  // ===== Einstellungen =====
  // Webhook-URL (z. B. Make). Leer lassen = kein E-Mail-Formular, Ergebnis wird direkt angezeigt.
  var WEBHOOK_URL = "";
  var CTA_TEXT = "Kostenloses Kennenlerngespräch buchen";
  var CTA_LINK = "";
  var DEMO_HINT = "Übungsprojekt – keine echte Beratung.";
  // =========================

  var QUESTIONS = [
    { q: "Wenn es zwischen euch knirscht – was passiert meistens?", answers: [
      { text: "Ich schlucke es runter, damit es keinen Streit gibt.", key: "harmonie" },
      { text: "Wir reden, aber irgendwie aneinander vorbei.", key: "sprache" },
      { text: "Ehrlich gesagt fehlt uns die Energie, es anzusprechen.", key: "alltag" } ] },
    { q: "Wie fühlt sich euer Alltag gerade an?", answers: [
      { text: "Nach außen ruhig, innen brodelt es.", key: "harmonie" },
      { text: "Viel Organisatorisches, wenig über uns.", key: "sprache" },
      { text: "Wie eine gut funktionierende WG.", key: "alltag" } ] },
    { q: "Was wünschst du dir am meisten?", answers: [
      { text: "Sagen zu können, was mich stört, ohne dass es eskaliert.", key: "harmonie" },
      { text: "Dass wir uns wieder richtig verstehen.", key: "sprache" },
      { text: "Wieder mehr Nähe und Leichtigkeit.", key: "alltag" } ] },
    { q: "Wann hattet ihr das letzte richtig gute Gespräch über euch?", answers: [
      { text: "Ist eine Weile her – ich trau mich oft nicht.", key: "harmonie" },
      { text: "Wir versuchen es, aber es endet oft im Missverständnis.", key: "sprache" },
      { text: "Ich kann mich gerade nicht erinnern.", key: "alltag" } ] }
  ];

  var RESULTS = {
    harmonie: {
      title: "Ihr seid die Harmonie-Bewahrer",
      text: "Du hältst viel aus, damit es ruhig bleibt. Das ist gut gemeint, aber Unausgesprochenes sammelt sich an und kommt später umso lauter raus.",
      tip: "Kleiner Schritt für diese Woche: Sprich eine Sache an, die dich stört, solange sie noch klein ist. In Ich-Form, ohne Vorwurf."
    },
    sprache: {
      title: "Ihr redet aneinander vorbei",
      text: "Ihr sprecht miteinander, aber die Botschaft kommt nicht an. Meistens liegt das nicht am Thema, sondern daran, wie ihr zuhört.",
      tip: "Kleiner Schritt für diese Woche: Wiederhol beim nächsten Gespräch kurz in eigenen Worten, was du verstanden hast, bevor du antwortest."
    },
    alltag: {
      title: "Der Alltag hat euch im Griff",
      text: "Ihr funktioniert gut als Team, aber für euch als Paar bleibt kaum Platz. Das passiert vielen und lässt sich ändern.",
      tip: "Kleiner Schritt für diese Woche: Plant 30 Minuten nur für euch zwei. Ohne Handy und ohne To-do-Liste."
    }
  };

  function pickResult(answers) {
    var count = { harmonie: 0, sprache: 0, alltag: 0 };
    answers.forEach(function (k) { count[k] += 1; });
    var max = Math.max(count.harmonie, count.sprache, count.alltag);
    var tied = Object.keys(count).filter(function (k) { return count[k] === max; });
    if (tied.length === 1) return tied[0];
    // Gleichstand: Antwort auf Frage 3 entscheidet
    if (answers[2] && tied.indexOf(answers[2]) !== -1) return answers[2];
    return tied[0];
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var total = QUESTIONS.length;
  var withForm = !!WEBHOOK_URL;
  var state = { step: -1, answers: [], name: "", email: "", consent: false, error: "", sending: false };
  var root = document.getElementById("quiz");

  function render() {
    var s = state, html = "";

    if (s.step === -1) {
      html =
        '<p class="eyebrow">Beziehungs-Check · 4 Fragen · 1 Minute</p>' +
        '<h2>Was steht zwischen euch?</h2>' +
        '<p>Beantworte vier kurze Fragen. Am Ende bekommst du deine Auswertung und einen ersten Schritt, den ihr direkt ausprobieren könnt.</p>' +
        '<button class="btn" data-action="start">Quiz starten</button>';
    } else if (s.step < total) {
      var q = QUESTIONS[s.step];
      html =
        '<div class="progress-row"><span class="small">Frage ' + (s.step + 1) + ' von ' + total + '</span>' +
        (s.step > 0 ? '<button class="link" data-action="back">← Zurück</button>' : '') + '</div>' +
        '<div class="bar"><div class="bar-fill" style="width:' + ((s.step + 1) / total * 100) + '%"></div></div>' +
        '<h3>' + esc(q.q) + '</h3><div class="answers">' +
        q.answers.map(function (a) {
          return '<button class="answer' + (s.answers[s.step] === a.key ? ' active' : '') +
            '" data-action="choose" data-key="' + a.key + '">' + esc(a.text) + '</button>';
        }).join("") + '</div>';
    } else if (s.step === total) {
      html =
        '<form novalidate>' +
        '<p class="eyebrow">Fast geschafft</p>' +
        '<h3>Wohin dürfen wir deine Auswertung schicken?</h3>' +
        '<p>Du siehst dein Ergebnis gleich hier und bekommst es zusätzlich per E-Mail.</p>' +
        '<label class="field">Vorname<input name="name" value="' + esc(s.name) + '" placeholder="z. B. Lena" autocomplete="given-name"></label>' +
        '<label class="field">E-Mail<input name="email" type="email" value="' + esc(s.email) + '" placeholder="du@beispiel.de" autocomplete="email"></label>' +
        '<label class="check"><input name="consent" type="checkbox"' + (s.consent ? ' checked' : '') + '>' +
        '<span>Ich bin einverstanden, dass meine Angaben gespeichert werden, um mir die Auswertung zu schicken. Abmelden geht jederzeit.</span></label>' +
        (s.error ? '<p class="error">' + esc(s.error) + '</p>' : '') +
        '<button class="btn" type="submit"' + (s.sending ? ' disabled' : '') + '>' + (s.sending ? 'Wird gesendet …' : 'Ergebnis anzeigen') + '</button>' +
        '<div style="margin-top:12px"><button type="button" class="link" data-action="back">← Zurück zur letzten Frage</button></div>' +
        '</form>';
    } else {
      var r = RESULTS[pickResult(s.answers)];
      html =
        '<p class="eyebrow">Dein Ergebnis' + (s.name.trim() ? ', ' + esc(s.name.trim()) : '') + '</p>' +
        '<h2>' + esc(r.title) + '</h2>' +
        '<p>' + esc(r.text) + '</p>' +
        '<div class="tip">' + esc(r.tip) + '</div>' +
        (CTA_LINK ? '<a class="btn" href="' + esc(CTA_LINK) + '">' + esc(CTA_TEXT) + '</a>' : '') +
        '<div style="margin-top:16px"><button class="link" data-action="restart">Quiz neu starten</button></div>';
    }

    if (DEMO_HINT) html += '<p class="demo">' + esc(DEMO_HINT) + '</p>';
    root.innerHTML = html;
  }

  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.getAttribute("data-action");
    if (a === "start") state.step = 0;
    else if (a === "back") state.step -= 1;
    else if (a === "choose") {
      state.answers = state.answers.slice(0, state.step).concat(el.getAttribute("data-key"));
      state.step += 1;
      // Ohne Webhook: Formular überspringen, Ergebnis direkt zeigen
      if (state.step === total && !withForm) state.step = total + 1;
    } else if (a === "restart") {
      state = { step: -1, answers: [], name: "", email: "", consent: false, error: "", sending: false };
    }
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  root.addEventListener("input", function (e) {
    var t = e.target;
    if (t.name === "name") state.name = t.value;
    if (t.name === "email") state.email = t.value;
    if (t.name === "consent") state.consent = t.checked;
  });
  root.addEventListener("change", function (e) {
    if (e.target.name === "consent") state.consent = e.target.checked;
  });

  root.addEventListener("submit", function (e) {
    e.preventDefault();
    var s = state;
    if (!s.name.trim()) s.error = "Bitte gib deinen Vornamen ein.";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.email.trim())) s.error = "Bitte gib eine gültige E-Mail-Adresse ein.";
    else if (!s.consent) s.error = "Bitte bestätige die Datenschutzhinweise.";
    else s.error = "";
    if (s.error) return render();

    s.sending = true;
    render();
    var key = pickResult(s.answers);
    var body = new URLSearchParams({
      firstName: s.name.trim(),
      email: s.email.trim(),
      resultKey: key,
      resultTitle: RESULTS[key].title,
      answers: s.answers.join(","),
      consent: "yes",
      submittedAt: new Date().toISOString()
    });
    fetch(WEBHOOK_URL, { method: "POST", body: body, keepalive: true })
      .catch(function () { /* Ergebnis wird trotzdem angezeigt */ })
      .then(function () {
        s.sending = false;
        s.step = total + 1;
        render();
      });
  });

  render();
</script>
</body>
</html>
